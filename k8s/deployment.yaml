apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: node-api}
  template:
    metadata:
      labels: {app: node-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/nodejs-cloud-native-api:latest
          ports: [{containerPort: 3000}]
          envFrom:
            - configMapRef: {name: node-api}
            - secretRef: {name: node-api}
          readinessProbe:
            httpGet: {path: /health/ready, port: 3000}
          livenessProbe:
            httpGet: {path: /health, port: 3000}